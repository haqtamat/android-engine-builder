name: Build Android Binary
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Unzip source if zip present
        run: |
          ls -lh
          if [ -f source.zip ]; then unzip -o source.zip -d src_unzipped; fi
          if [ -f Stockfish-sf_19.zip ]; then unzip -o Stockfish-sf_19.zip -d src_unzipped; fi
          ls -R | head -n 100
      - name: Build Android Binary
        run: |
          SRC_DIR=$(find src_unzipped -name Makefile | head -n 1 | xargs dirname)
          echo "SRC_DIR=$SRC_DIR"
          cd "$SRC_DIR"
          export NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CXX=$NDK_BIN/aarch64-linux-android21-clang++
          export CC=$NDK_BIN/aarch64-linux-android21-clang
          make -j4 build ARCH=armv8 COMP=clang
          ls -lh stockfish
          mkdir -p $GITHUB_WORKSPACE/out
          cp stockfish $GITHUB_WORKSPACE/out/stockfish-android-arm64-v8a
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: android-engine-arm64-v8a
          path: out/
