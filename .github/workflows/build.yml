name: Build Android Binary
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Unzip source if zip present
        run: |
          ls -la
          unzip -o Stockfish-sf_19.zip -d extracted
          ls -la extracted/Stockfish-sf_19/src
          echo "SRC_DIR=extracted/Stockfish-sf_19/src" >> $GITHUB_ENV
      - name: Build Android Binary
        run: |
          set -e
          echo "NDK=$ANDROID_NDK_HOME"
          cd $SRC_DIR
          ls -la
          sed -i 's/-lpthread -lrt//g; s/-lpthread//g; s/-lrt//g' Makefile
          make -j4 build ARCH=armv7 COMP=clang CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          echo "=== BEFORE STRIP ==="
          ls -lh stockfish
          file stockfish || true
          STRIP=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip
          ls -lh $STRIP || echo "llvm-strip NOT FOUND"
          $STRIP --strip-all stockfish || $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-strip stockfish || strip stockfish || true
          echo "=== AFTER STRIP ==="
          ls -lh stockfish
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          upx --best --lzma stockfish || true
          echo "=== AFTER UPX ==="
          ls -lh stockfish
          mkdir -p $GITHUB_WORKSPACE/out
          cp stockfish $GITHUB_WORKSPACE/out/
          ls -lh $GITHUB_WORKSPACE/out/
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: out/*
