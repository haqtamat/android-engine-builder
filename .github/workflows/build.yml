name: Build Android Binary
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
      - name: Unzip source if zip present
        run: |
          ls -la
          if ls *.zip 1>/dev/null 2>&1; then
            unzip -o *.zip -d src
            ls -la src
          fi
          if [ -d src ]; then
            echo "SRC_DIR=src" >> $GITHUB_ENV
          elif [ -f Makefile ]; then
            echo "SRC_DIR=." >> $GITHUB_ENV
          else
            echo "SRC_DIR=$(ls -d */ | head -n1)" >> $GITHUB_ENV
          fi
          echo "SRC_DIR=$SRC_DIR"
      - name: Build Android Binary
        run: |
          set -e
          echo "NDK=$ANDROID_NDK_HOME"
          cd $SRC_DIR
          ls -la
          make -j4 build ARCH=armv7 COMP=clang CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++ || make -j4 ARCH=armv7 COMP=clang CXX=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++
          mkdir -p ../out
          cp stockfish ../out/ || cp src/stockfish ../out/ || find . -maxdepth 2 -name stockfish -exec cp {} ../out/ \;
          ls -lh ../out/
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: android-binary
          path: out/*
